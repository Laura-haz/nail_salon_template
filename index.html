<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nail salon</title>
<meta name="description" content="Nail studio · Studio d'ongles">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="demo-banner" id="demo-banner" hidden></div>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav" aria-label="Main">
      <a href="#services" data-ui="navServices"></a>
      <a href="#gallery" data-ui="navGallery"></a>
      <a href="#reviews" data-ui="navReviews"></a>
      <a href="#visit" data-ui="navVisit"></a>
    </nav>
    <div class="header-actions">
      <div class="lang" id="lang" role="group" aria-label="Language / Langue"></div>
      <a class="btn btn-solid btn-small" data-book data-short href="#"></a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-inner">
      <div class="hero-copy">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="lede" id="hero-text"></p>
        <div class="hero-ctas">
          <a class="btn btn-solid" data-book href="#"></a>
          <a class="btn btn-ghost" href="#services" data-ui="seePrices"></a>
        </div>
        <ul class="hero-facts" id="hero-facts"></ul>
      </div>
      <div class="hero-art" aria-hidden="true">
        <div class="fan" id="fan"></div>
      </div>
    </div>
  </section>

  <section class="section" id="services">
    <div class="wrap">
      <div class="section-head">
        <h2 data-ui="servicesTitle"></h2>
        <p class="muted small" id="price-note"></p>
      </div>
      <div class="menu" id="menu"></div>
    </div>
  </section>

  <section class="section section-alt" id="gallery">
    <div class="wrap">
      <div class="section-head">
        <h2 data-ui="galleryTitle"></h2>
        <a class="link-arrow" id="insta" href="#" target="_blank" rel="noopener" data-ui="galleryMore"></a>
      </div>
      <div class="gallery" id="gallery-grid"></div>
    </div>
  </section>

  <section class="section" id="reviews">
    <div class="wrap">
      <div class="section-head">
        <h2 data-ui="reviewsTitle"></h2>
        <p class="rating" id="rating"></p>
      </div>
      <div class="quotes" id="quotes"></div>
    </div>
  </section>

  <section class="section section-alt" id="visit">
    <div class="wrap visit">
      <div class="visit-info">
        <h2 data-ui="visitTitle"></h2>
        <address id="address"></address>
        <p class="muted" id="location-note"></p>
        <a class="link-arrow" id="directions" href="#" target="_blank" rel="noopener" data-ui="directions"></a>

        <h3 data-ui="contactTitle"></h3>
        <ul class="contact" id="contact"></ul>
      </div>
      <div class="hours-card">
        <div class="hours-head">
          <h3 data-ui="hoursTitle"></h3>
          <span class="status" id="status"></span>
        </div>
        <table class="hours"><tbody id="hours"></tbody></table>
      </div>
      <div class="map" id="map"></div>
    </div>
  </section>

  <section class="book-band">
    <div class="wrap book-inner">
      <div>
        <h2 data-ui="bookTitle"></h2>
        <p id="book-note"></p>
      </div>
      <a class="btn btn-light" data-book href="#"></a>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner" id="footer"></div>
</footer>

<!-- Client content lives in salon-config.js -->
<script src="salon-config.js"></script>
<script src="script.js"></script>
</body>
</html>
